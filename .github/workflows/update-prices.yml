name: Update Stock Prices

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Ensure data files exist
        run: |
          [ -f ipo_tracker_data.json ] || echo '{"listed":[],"upcoming":[]}' > ipo_tracker_data.json

      - name: Debug IPO_JSON path
        run: grep -n "IPO_JSON" update_prices.py

      - name: Fetch prices and update data.js
        run: python3 update_prices.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --staged --quiet || git commit -m "prices: auto-update $(date -u +'%d %b %Y %H:%M UTC')"
          git push
